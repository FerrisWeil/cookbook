title = "cookbook"

# A config file replaces the built-in rules unless it extends them.
# Without this, `pnpm check` can pass with zero detectors.
[extend]
useDefault = true

[allowlist]
description = "Documented local-only placeholders, never used on the NAS"
regexes = [
  '''local-[A-Za-z0-9-]+-not-for-nas''',
]
paths = [
  '''^\.gitleaks\.toml$''',
]
