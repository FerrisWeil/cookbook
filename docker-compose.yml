# Local / cloud-agent stack. Publishes the web, API, and MCP ports on the host.
# Postgres is not published. Reach it with `docker compose exec db psql`.
# NAS deploy: docker compose -f deploy/nas/docker-compose.yml
# (no host ports, Tailscale only).
#
# Web reaches the API through the published host port (extra_hosts) so this
# file still works when Docker bridge traffic between containers is blocked.
# The API reaches Postgres by the Docker DNS name `db` on the internal
# network. That path needs working bridge traffic. GitHub CI and Unraid have
# it. Do not publish 5432 to paper over a VM that does not.

services:
  db:
    image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: cookbook
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    volumes:
      - cookbook_pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cookbook"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - db

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      POSTGRES_APP_USER: cookbook_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      POSTGRES_MIGRATOR_USER: cookbook_migrator
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cookbook
      BIND_HOST: "0.0.0.0"
      PORT: "3000"
      MIGRATIONS_DIR: /app/db/migrations
      SEED_FILE: /app/db/seed.sql
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - db
      - app

  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-local-dev-token-not-for-nas}
      MCP_ALLOW_DEV_TOKEN: "1"
      MCP_HOSTNAME: cookbook-mcp
      BIND_HOST: "0.0.0.0"
      PORT: "8787"
    ports:
      - "8787:8787"
    networks:
      - app

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    extra_hosts:
      - "api:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - app

volumes:
  cookbook_pg:

networks:
  db:
    internal: true
  app:
