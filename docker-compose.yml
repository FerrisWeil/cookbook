# Local / cloud-agent stack. Publishes ports on the host.
# NAS deploy: docker compose -f deploy/nas/docker-compose.yml
# (no host ports, Tailscale only).
#
# extra_hosts + published ports: services reach each other via the host
# gateway so this file still works when Docker bridge ICC is unavailable
# (some nested VMs). Unraid networking does not need this.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cookbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cookbook}
      POSTGRES_DB: cookbook
    volumes:
      - cookbook_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookbook -d cookbook"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    extra_hosts:
      - "db:host-gateway"
    environment:
      DATABASE_URL: postgres://cookbook:${POSTGRES_PASSWORD:-cookbook}@db:5432/cookbook
      BIND_HOST: "0.0.0.0"
      PORT: "3000"
      MIGRATIONS_DIR: /app/db/migrations
      SEED_FILE: /app/db/seed.sql
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-local-dev-token-not-for-nas}
      MCP_HOSTNAME: cookbook-mcp
      BIND_HOST: "0.0.0.0"
      PORT: "8787"
    ports:
      - "8787:8787"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    extra_hosts:
      - "api:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  cookbook_pg:
