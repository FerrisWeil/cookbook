# All interfaces. The local stack publishes 8080 onto this container's
# eth0. NAS compose mounts deploy/nas/nginx.conf over the template path.
# ${API_AUTH_TOKEN_WEB} is substituted at container start. Nginx variables
# stay as $host / $scheme.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /api/recipes/events {
        if ($request_method != GET) {
            return 405;
        }
        proxy_pass http://api:3000/recipes/events;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${API_AUTH_TOKEN_WEB}";
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering no;
    }

    location ~ ^/api/recipes/([^/]+)/facts$ {
        set $facts_id $1;
        if ($request_method != PATCH) {
            return 405;
        }
        # `if` treats `$` inside `(…)` as the end of the condition, so this
        # is a prefix match, not `(;|$)`.
        if ($content_type !~* ^application/json) {
            return 415;
        }
        set $facts_origin_ok 0;
        if ($http_origin = "http://$http_host") {
            set $facts_origin_ok 1;
        }
        if ($http_origin = "https://$http_host") {
            set $facts_origin_ok 1;
        }
        if ($facts_origin_ok != 1) {
            return 403;
        }
        client_max_body_size 8k;
        rewrite ^ /recipes/$facts_id/facts break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${API_AUTH_TOKEN_WEB}";
    }

    location /api/recipes {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        proxy_pass http://api:3000/recipes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${API_AUTH_TOKEN_WEB}";
    }

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
