id: "5"
title: Recipes
requirements:
  - id: "5.1"
    type: functional
    text: The ingredient line is the source of truth.
    details:
      - id: "5.1.1"
        text: Amount, unit, and name may be empty.
      - id: "5.1.2"
        text: Given a written line, an unstated amount, unit, or name is stored empty.
      - id: "5.1.3"
        text: The written ingredient line is required.
      - id: "5.1.4"
        text: The order of the ingredient list is the stored order.
      - id: "5.1.5"
        text: A save replaces the stored ingredient lines.

  - id: "5.2"
    type: functional
    text: A recipe has a favorite flag.
    details:
      - id: "5.2.1"
        text: A recipe has one favorite.
      - id: "5.2.2"
        text: The favorite is the household's.
      - id: "5.2.3"
        text: The favorite defaults to off.

  - id: "5.3"
    type: functional
    text: A recipe has one optional rating.
    details:
      - id: "5.3.1"
        text: A rating is one score for the recipe, empty or a whole number from 1 to 5.
      - id: "5.3.2"
        text: Given a new rating, the stored favorite stays.
      - id: "5.3.3"
        text: A recipe can be a favorite while the rating is empty.

  - id: "5.4"
    type: functional
    text: A recipe may have nutrition.
    details:
      - id: "5.4.1"
        text: A recipe has at most one nutrition row.
      - id: "5.4.2"
        text: The numbers are per serving.
      - id: "5.4.3"
        text: Given the label estimated, the numbers were calculated from the ingredients.
      - id: "5.4.4"
        text: Given the label entered, a person typed the numbers.
      - id: "5.4.5"
        text: Given the label copied, the numbers were taken from a package label or a published recipe.
      - id: "5.4.6"
        text: A nutrition row has exactly one label, and that label is estimated, entered, or copied.
      - id: "5.4.7"
        text: The divisor is the recipe's stored servings.
      - id: "5.4.8"
        text: That servings is greater than zero.
      - id: "5.4.9"
        text: Given a save that omits nutrition, the stored nutrition row stays.
      - id: "5.4.10"
        text: Given a save that clears nutrition, that nutrition row is removed.

  - id: "5.5"
    type: functional
    text: Delete hides a recipe.
    details:
      - id: "5.5.1"
        text: A deleted recipe is hidden from read and from list.
      - id: "5.5.2"
        text: The recipe stays stored.
      - id: "5.5.3"
        text: A save does not make a deleted recipe visible again.
      - id: "5.5.4"
        text: The hidden recipe records when it was hidden.
      - id: "5.5.5"
        text: The hidden recipe records who hid it.

  - id: "5.6"
    type: functional
    text: Git ships the household actors.
    details:
      - id: "5.6.1"
        text: The actors shipped in git are taylor, chef, and system.
      - id: "5.6.2"
        text: Given no actor, a save is refused.
      - id: "5.6.3"
        text: Another cook is added on the NAS, outside git.
        implemented: false

  - id: "5.7"
    type: functional
    text: A recipe has a title.
    details:
      - id: "5.7.1"
        text: The title is non-empty.
      - id: "5.7.2"
        text: Two recipes may share a title.

  - id: "5.8"
    type: functional
    text: A recipe stores steps.
    details:
      - id: "5.8.1"
        text: Steps are stored in the order they were saved.
      - id: "5.8.2"
        text: A step is stored as plain text.

  - id: "5.9"
    type: functional
    text: A recipe has servings.
    details:
      - id: "5.9.1"
        text: A recipe stores its servings.
      - id: "5.9.2"
        text: Without a servings count greater than zero, a save is refused.
      - id: "5.9.3"
        text: Given a scaled view, the stored recipe stays the authored one.

  - id: "5.10"
    type: functional
    text: A recipe keeps a stable id.
    details:
      - id: "5.10.1"
        text: A recipe id is opaque.
      - id: "5.10.2"
        text: Given an id from the caller, the saved recipe uses that id.
      - id: "5.10.3"
        text: Given the id of a visible recipe, a save updates that recipe.
      - id: "5.10.4"
        text: The actor recorded at creation does not change.
      - id: "5.10.5"
        text: Given a changed title, the recipe keeps its id.
