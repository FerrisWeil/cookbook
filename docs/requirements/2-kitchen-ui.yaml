id: "2"
title: Kitchen UI
requirements:
  - id: "2.1"
    type: functional
    text: A user can open the app on a desktop browser or a phone.
    details:
      - id: "2.1.1"
        text: Given a desktop browser, the user can open the app.
        implemented: false
      - id: "2.1.2"
        text: Given a phone, the user can open the app.
        implemented: false

  - id: "2.2"
    type: non-functional
    text: The app is an installable responsive web app.
    details:
      - id: "2.2.1"
        text: The layout responds to the screen size.
        implemented: false
      - id: "2.2.2"
        text: Given a secure context, the app can be installed to the home screen.
        implemented: false
      - id: "2.2.3"
        text: Given a document that fails to load, the browser shows its own error.
        implemented: false
      - id: "2.2.4"
        text: Given a loaded app, a failed read is told in words.
        implemented: false
      - id: "2.2.5"
        text: The production tailnet address opens the app in the browser.
        implemented: false

  - id: "2.3"
    type: functional
    text: The app has three screens.
    details:
      - id: "2.3.1"
        text: The screens are the recipe list, one recipe, and settings.
        implemented: false
      - id: "2.3.2"
        text: The settings screen is where a theme is chosen.
        implemented: false
      - id: "2.3.3"
        text: The list shows each recipe's title.
        implemented: false
      - id: "2.3.4"
        text: The list shows each recipe's favorite.
        implemented: false
      - id: "2.3.5"
        text: The recipe screen shows the title.
        implemented: false
      - id: "2.3.6"
        text: The recipe screen shows the ingredient lines.
        implemented: false
      - id: "2.3.7"
        text: The recipe screen shows the steps in saved order.
        implemented: false
      - id: "2.3.8"
        text: Given a nutrition row, the recipe screen shows it.
        implemented: false
      - id: "2.3.9"
        text: Given a rating, the recipe screen shows it.
        implemented: false
      - id: "2.3.10"
        text: The recipe screen shows each ingredient as one written line.
        implemented: false
      - id: "2.3.11"
        text: The list includes a recipe whose favorite is off.
        implemented: false

  - id: "2.4"
    type: non-functional
    text: The three screens have an accessibility floor.
    details:
      - id: "2.4.1"
        text: The three screens meet WCAG 2.2 AA.
        implemented: false
      - id: "2.4.2"
        text: A primary action target is at least 44 by 44 CSS pixels.
        implemented: false
      - id: "2.4.3"
        text: Every action is reachable by a click or a tap.
        implemented: false
      - id: "2.4.4"
        text: The user can zoom the page.
        implemented: false
      - id: "2.4.5"
        text: On the recipe screen, no control overlaps the title, ingredient lines, or steps.
        implemented: false

  - id: "2.5"
    type: functional
    text: The user can select a theme.
    details:
      - id: "2.5.1"
        text: The first paint follows the system.
        implemented: false
      - id: "2.5.2"
        text: Given a theme chosen on settings, the three screens use that theme.
        implemented: false

  - id: "2.6"
    type: functional
    text: A phone write is attributed to system.
    details:
      - id: "2.6.1"
        text: A phone write records the actor as system.
        implemented: false
      - id: "2.6.2"
        text: A phone write may set the favorite and the rating.
        implemented: false
      - id: "2.6.3"
        text: A phone write leaves the title, ingredient lines, steps, servings, and nutrition unchanged.
        implemented: false
      - id: "2.6.4"
        text: The phone write screen offers the favorite and the rating.
        implemented: false
