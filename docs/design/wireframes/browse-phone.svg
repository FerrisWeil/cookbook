<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img">
  <title>Phone wireframe: recipe list, glass cards, floating theme control</title>
  <rect width="390" height="844" fill="#f6f1e9"/>
  <ellipse cx="300" cy="220" rx="140" ry="100" fill="#3d5a40" opacity="0.2"/>
  <text x="16" y="36" fill="#5c5348" font-family="system-ui, sans-serif" font-size="12">safe area</text>
  <text x="16" y="88" fill="#2b241c" font-family="Georgia, serif" font-size="32">Recipes</text>
  <rect x="16" y="116" width="358" height="96" rx="16" fill="#ffffff" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.9"/>
  <text x="32" y="156" fill="#2b241c" font-family="Georgia, serif" font-size="22">Example: Tomato lentils</text>
  <text x="32" y="184" fill="#5c5348" font-family="system-ui, sans-serif" font-size="14">Placeholder meta · fields undecided</text>
  <rect x="16" y="228" width="358" height="96" rx="16" fill="#ffffff" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.9"/>
  <text x="32" y="268" fill="#2b241c" font-family="Georgia, serif" font-size="22">Example: Weeknight oats</text>
  <text x="32" y="296" fill="#5c5348" font-family="system-ui, sans-serif" font-size="14">Placeholder meta · fields undecided</text>
  <text x="16" y="360" fill="#5c5348" font-family="system-ui, sans-serif" font-size="13">Example data. Glass panels. No header bar.</text>
  <rect x="246" y="736" width="112" height="48" rx="24" fill="#ffffff" fill-opacity="0.82" stroke="#ffffff"/>
  <text x="302" y="766" text-anchor="middle" fill="#2b241c" font-family="system-ui, sans-serif" font-size="16">Theme</text>
  <text x="16" y="828" fill="#5c5348" font-family="system-ui, sans-serif" font-size="12">safe area</text>
</svg>
