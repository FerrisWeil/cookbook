<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img">
  <title>Phone wireframe: example recipe, opaque Back above the title</title>
  <rect width="390" height="844" fill="#0b1a2c"/>
  <text x="16" y="36" fill="#b7cde3" font-family="system-ui, sans-serif" font-size="12">safe area</text>
  <rect x="16" y="52" width="88" height="44" rx="12" fill="#8bbde8"/>
  <text x="60" y="79" text-anchor="middle" fill="#0b1a2c" font-family="system-ui, sans-serif" font-size="16">Back</text>
  <text x="16" y="148" fill="#e8f3fc" font-family="system-ui, sans-serif" font-size="28">Example: Tomato lentils</text>
  <text x="16" y="180" fill="#b7cde3" font-family="system-ui, sans-serif" font-size="14">4/5</text>
  <rect x="16" y="208" width="358" height="120" rx="16" fill="#16324c" stroke="#7a93ad"/>
  <text x="32" y="256" fill="#e8f3fc" font-family="system-ui, sans-serif" font-size="18">Example body text.</text>
  <text x="32" y="288" fill="#e8f3fc" font-family="system-ui, sans-serif" font-size="18">Not a schema. Not a real meal.</text>
  <text x="16" y="800" fill="#b7cde3" font-family="system-ui, sans-serif" font-size="12">last line stays above the safe area</text>
</svg>
