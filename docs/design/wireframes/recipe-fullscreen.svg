<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
  <title>Wide wireframe: example recipe fullscreen, updating without a click</title>
  <rect width="1200" height="800" fill="#f6f1e9"/>
  <rect x="24" y="24" width="200" height="44" rx="8" fill="#efe6d6" stroke="#7d7264"/>
  <text x="124" y="52" text-anchor="middle" fill="#2b241c" font-family="system-ui, sans-serif" font-size="16">Exit full screen</text>
  <text x="24" y="128" fill="#2b241c" font-family="Georgia, serif" font-size="40">Example: Tomato lentils</text>
  <text x="24" y="164" fill="#5c5348" font-family="system-ui, sans-serif" font-size="16">Placeholder meta · fields undecided</text>
  <text x="24" y="230" fill="#3d5a40" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Steps</text>
  <text x="24" y="268" fill="#2b241c" font-family="Georgia, serif" font-size="22">1. Example step</text>
  <text x="24" y="308" fill="#2b241c" font-family="Georgia, serif" font-size="22">2. Example step</text>
  <rect x="24" y="360" width="720" height="88" rx="12" fill="#efe6d6" stroke="#3d5a40"/>
  <text x="44" y="396" fill="#2b241c" font-family="system-ui, sans-serif" font-size="16">This block can change while the page sits open.</text>
  <text x="44" y="422" fill="#5c5348" font-family="system-ui, sans-serif" font-size="16">Example only. No click. Chef's chat is not drawn here.</text>
  <text x="24" y="500" fill="#5c5348" font-family="system-ui, sans-serif" font-size="14">Rail hidden. Phone does not use this mode.</text>
</svg>
