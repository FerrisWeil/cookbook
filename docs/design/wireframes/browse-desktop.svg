<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
  <title>Wide wireframe: recipe list grid, one card fill, favorite sibling, no rail and no theme control</title>
  <rect width="1200" height="800" fill="#f6f1e9"/>
  <text x="80" y="88" fill="#2b241c" font-family="Georgia, serif" font-size="40">Recipes</text>
  <rect x="80" y="120" width="340" height="128" rx="12" fill="#efe6d6" stroke="#7d7264"/>
  <text x="104" y="156" fill="#2b241c" font-family="Georgia, serif" font-size="22">Example: Tomato lentils</text>
  <text x="388" y="156" text-anchor="middle" fill="#3d5a40" font-family="system-ui, sans-serif" font-size="20">&#9733;</text>
  <text x="104" y="188" fill="#5c5348" font-family="system-ui, sans-serif" font-size="16">4/5</text>
  <text x="104" y="216" fill="#5c5348" font-family="system-ui, sans-serif" font-size="16">vegetarian &#183; pantry +1</text>
  <rect x="444" y="120" width="340" height="128" rx="12" fill="#efe6d6" stroke="#7d7264"/>
  <text x="468" y="156" fill="#2b241c" font-family="Georgia, serif" font-size="22">Example: Weeknight oats</text>
  <text x="752" y="156" text-anchor="middle" fill="#5c5348" font-family="system-ui, sans-serif" font-size="20">&#9734;</text>
  <text x="468" y="216" fill="#5c5348" font-family="system-ui, sans-serif" font-size="16">breakfast &#183; vegetarian</text>
  <rect x="80" y="268" width="340" height="128" rx="12" fill="#efe6d6" stroke="#7d7264"/>
  <text x="104" y="304" fill="#2b241c" font-family="Georgia, serif" font-size="22">Example: Citrus chicken</text>
  <text x="388" y="304" text-anchor="middle" fill="#5c5348" font-family="system-ui, sans-serif" font-size="20">&#9734;</text>
  <text x="104" y="336" fill="#5c5348" font-family="system-ui, sans-serif" font-size="16">5/5</text>
  <text x="104" y="364" fill="#5c5348" font-family="system-ui, sans-serif" font-size="16">dinner</text>
  <text x="80" y="440" fill="#5c5348" font-family="system-ui, sans-serif" font-size="14">Example data. Grid from the wide breakpoint. No sidebar. No theme control.</text>
</svg>
