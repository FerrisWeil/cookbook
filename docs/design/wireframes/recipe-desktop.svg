<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
  <title>Wide wireframe: example recipe, opaque Back above the title, no rail</title>
  <rect width="1200" height="800" fill="#f5f9fc"/>
  <rect x="80" y="40" width="88" height="44" rx="12" fill="#134175"/>
  <text x="124" y="68" text-anchor="middle" fill="#f5f9fc" font-family="system-ui, sans-serif" font-size="16">Back</text>
  <text x="80" y="140" fill="#0b2b51" font-family="system-ui, sans-serif" font-size="40">Example: Tomato lentils</text>
  <text x="80" y="176" fill="#3a5a78" font-family="system-ui, sans-serif" font-size="16">4/5</text>
  <rect x="80" y="204" width="760" height="96" rx="16" fill="#d7e6f5" stroke="#5a7390"/>
  <text x="104" y="252" fill="#0b2b51" font-family="system-ui, sans-serif" font-size="20">Example body text. Not a schema. Not a real meal.</text>
  <text x="80" y="360" fill="#3a5a78" font-family="system-ui, sans-serif" font-size="14">Example data. Opaque control. No sidebar. Text is not under the button.</text>
