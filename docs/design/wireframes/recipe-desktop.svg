  <rect x="80" y="40" width="88" height="44" rx="8" fill="#efe6d6" stroke="#7d7264"/>
  <text x="124" y="68" text-anchor="middle" fill="#2b241c" font-family="system-ui, sans-serif" font-size="16">Back</text>
  <text x="80" y="140" fill="#2b241c" font-family="Georgia, serif" font-size="40">Example: Tomato lentils</text>
  <text x="80" y="176" fill="#5c5348" font-family="system-ui, sans-serif" font-size="16">Placeholder meta · fields undecided</text>
