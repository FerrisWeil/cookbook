<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img">
  <title>Phone wireframe: Plan, marked as later and not a v1 route</title>
  <rect width="390" height="844" fill="#f6f1e9"/>
  <rect x="8" y="8" width="374" height="828" fill="none" stroke="#7d7264" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="195" y="80" text-anchor="middle" fill="#8a3b2a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">NOT IN V1 · NO ROUTE</text>
  <text x="16" y="150" fill="#2b241c" font-family="Georgia, serif" font-size="32">Plan</text>
  <text x="16" y="190" fill="#5c5348" font-family="system-ui, sans-serif" font-size="16">Weekly meals. Drawn so the nav can</text>
  <text x="16" y="214" fill="#5c5348" font-family="system-ui, sans-serif" font-size="16">gain one item later. Not a tab yet.</text>
  <rect x="16" y="250" width="358" height="72" rx="12" fill="none" stroke="#7d7264" stroke-dasharray="6 4"/>
  <text x="32" y="292" fill="#5c5348" font-family="system-ui, sans-serif" font-size="16">Day · example slot</text>
  <rect x="16" y="338" width="358" height="72" rx="12" fill="none" stroke="#7d7264" stroke-dasharray="6 4"/>
  <text x="32" y="380" fill="#5c5348" font-family="system-ui, sans-serif" font-size="16">Day · example slot</text>
  <text x="16" y="460" fill="#5c5348" font-family="system-ui, sans-serif" font-size="14">v1 nav is Browse and Search only.</text>
  <text x="16" y="484" fill="#5c5348" font-family="system-ui, sans-serif" font-size="14">Do not ship Plan as a disabled tab.</text>
  <rect y="732" width="390" height="68" fill="#efe6d6"/>
  <text x="70" y="772" text-anchor="middle" fill="#5c5348" font-family="system-ui, sans-serif" font-size="15">Browse</text>
  <text x="195" y="772" text-anchor="middle" fill="#5c5348" font-family="system-ui, sans-serif" font-size="15">Search</text>
  <text x="320" y="772" text-anchor="middle" fill="#3d5a40" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Plan</text>
  <line x1="296" y1="782" x2="344" y2="782" stroke="#3d5a40" stroke-width="3"/>
  <rect y="800" width="390" height="44" fill="#e4d9c8"/>
  <text x="16" y="826" fill="#5c5348" font-family="system-ui, sans-serif" font-size="13">safe area · shown only to reserve the slot</text>
</svg>
