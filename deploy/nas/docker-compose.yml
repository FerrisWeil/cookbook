# Unraid / NAS stack. No host ports. Reach this from Tailscale, not the LAN.
# Copy .env.example to .env at the repo root and fill real secrets first.
#
#   docker compose --env-file .env -f deploy/nas/docker-compose.yml up --build -d
#
# MCP is its own tailnet device with its own Tailscale auth key.
# The family web app is a second device with a second key.
# State lives under COOKBOOK_DATA_DIR (default /mnt/user/appdata/cookbook).
# Do not enable Tailscale Funnel. Do not also publish these services in Unraid's UI.
# Do not set MCP_ALLOW_DEV_TOKEN here.

name: cookbook-nas

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cookbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cookbook
      TZ: ${TZ:-UTC}
    volumes:
      - ${COOKBOOK_DATA_DIR:-/mnt/user/appdata/cookbook}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookbook -d cookbook"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - cookbook

  api:
    build:
      context: ../..
      dockerfile: docker/api.Dockerfile
    environment:
      POSTGRES_USER: cookbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cookbook
      BIND_HOST: "0.0.0.0"
      PORT: "3000"
      MIGRATIONS_DIR: /app/db/migrations
      SEED_FILE: /app/db/seed.sql
      TZ: ${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cookbook

  web-tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_WEB_HOSTNAME:-cookbook}
    environment:
      TS_AUTHKEY: ${TS_WEB_AUTHKEY:?Set TS_WEB_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_HOSTNAME: ${TS_WEB_HOSTNAME:-cookbook}
      TS_EXTRA_ARGS: --advertise-tags=tag:cookbook-web
      TS_SERVE_CONFIG: /config/web-serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:41234
    volumes:
      - ${COOKBOOK_DATA_DIR:-/mnt/user/appdata/cookbook}/tailscale-web:/var/lib/tailscale
      - ./tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - cookbook

  web:
    build:
      context: ../..
      dockerfile: docker/web.Dockerfile
    network_mode: service:web-tailscale
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web-tailscale:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  mcp-tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_MCP_HOSTNAME:-cookbook-mcp}
    environment:
      TS_AUTHKEY: ${TS_MCP_AUTHKEY:?Set TS_MCP_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_HOSTNAME: ${TS_MCP_HOSTNAME:-cookbook-mcp}
      TS_EXTRA_ARGS: --advertise-tags=tag:cookbook-mcp
      TS_SERVE_CONFIG: /config/mcp-serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:41234
    volumes:
      - ${COOKBOOK_DATA_DIR:-/mnt/user/appdata/cookbook}/tailscale-mcp:/var/lib/tailscale
      - ./tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - cookbook

  mcp:
    build:
      context: ../..
      dockerfile: docker/mcp.Dockerfile
    network_mode: service:mcp-tailscale
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
      MCP_HOSTNAME: ${TS_MCP_HOSTNAME:-cookbook-mcp}
      BIND_HOST: "127.0.0.1"
      PORT: "8787"
      TZ: ${TZ:-UTC}
    depends_on:
      mcp-tailscale:
        condition: service_healthy
    restart: unless-stopped
    init: true

networks:
  cookbook:
    name: cookbook
