# NAS only. Tailscale Serve proxies to 127.0.0.1:80, so loopback is the
# only listener. Local compose keeps docker/nginx.conf on port 80 for
# the published host port. Docker delivers published ports on eth0.
# ${API_AUTH_TOKEN_WEB} is substituted at container start.
server {
    listen 127.0.0.1:80;
    server_name _;
    root /usr/share/nginx/html;

    location = /api/recipes/events {
        if ($request_method != GET) {
            return 405;
        }
        proxy_pass http://api:3000/recipes/events;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${API_AUTH_TOKEN_WEB}";
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering no;
    }

    location /api/recipes {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        proxy_pass http://api:3000/recipes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${API_AUTH_TOKEN_WEB}";
    }

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
