# NAS only. Tailscale Serve proxies to 127.0.0.1:80, so loopback is the
# only listener. Local compose keeps docker/nginx.conf on port 80 for
# the published host port. Docker delivers published ports on eth0.
server {
    listen 127.0.0.1:80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
